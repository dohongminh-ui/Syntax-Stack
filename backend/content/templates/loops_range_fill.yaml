id: loops_range_fill
topic: loops
type: fill_blank
hints:
  - "range() dừng trước giá trị kết thúc."
  - "Đếm xem cần bao nhiêu số được in ra, và số đầu tiên là số nào."
  - "Giá trị kết thúc lớn hơn số cuối cùng cần in đúng một đơn vị."
explanation: "range(bắt_đầu, kết_thúc) chạy từ bắt_đầu đến kết_thúc - 1, không gồm giá trị kết thúc. Muốn in {expected_inline} thì giá trị kết thúc phải là {answer}."
tiers:
  1:
    - count: 10
      prompt: "Điền giá trị còn thiếu để chương trình in ra {expected_inline}."
      code: |
        for {v} in range(___):
            print({v})
      params:
        v: [i, j, k, n, so, dem]
        n: [2, 3, 4, 5]
      answer: "{n}"
      distractors:
        - {name: off_by_one_low, frag: "{n-1}"}
        - {name: off_by_one_high, frag: "{n+1}"}
        - {name: start_at_one, frag: "1, {n}"}
        - {name: too_long, frag: "{n+2}"}
      explanation: "range({n}) cho các số từ 0 đến {n-1}, tức là {expected_inline}. range() không bao giờ gồm số kết thúc."
  2:
    - count: 10
      prompt: "Điền giá trị kết thúc để chương trình in ra {expected_inline}."
      code: |
        for {v} in range({a}, ___):
            print({v})
      params:
        v: [i, j, k, so]
        a: [2, 3, 4]
        n: [2, 3, 4]
      derived:
        end: "a + n"
      answer: "{end}"
      distractors:
        - {name: off_by_one_low, frag: "{end-1}"}
        - {name: off_by_one_high, frag: "{end+1}"}
        - {name: count_instead_of_end, frag: "{n}"}
        - {name: product_instead_of_end, frag: "{a*n}"}
      explanation: "range({a}, {end}) bắt đầu từ {a} và dừng trước {end}, nên in {expected_inline}. Giá trị kết thúc = số bắt đầu + số lần lặp = {a} + {n}."
  3:
    - count: 10
      prompt: "Vòng lặp cộng các số chẵn. Điền giá trị kết thúc của range() để in ra {expected_inline}."
      code: |
        {t} = 0
        for {v} in range({a}, ___):
            if {v} % 2 == 0:
                {t} = {t} + {v}
        print({t})
      params:
        t: [tong, kq, s]
        v: [i, j, k]
        a: [1, 2]
        e: [4, 6, 8]
      answer: "{e}"
      distractors:
        - {name: off_by_one_high, frag: "{e+1}"}
        - {name: too_short, frag: "{e-2}"}
        - {name: too_long, frag: "{e+2}"}
      explanation: "range({a}, {e}) xét các số từ {a} đến {e-1}; chỉ số chẵn được cộng vào {t}, và tổng là {expected_inline}."
