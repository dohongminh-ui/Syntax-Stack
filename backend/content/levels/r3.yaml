hints:
  - "Vòng lặp for lặp lại các dòng thụt vào dưới nó. range(n) cho các số bắt đầu từ 0."
  - "Viết một vòng for dùng biến i, bên dưới thụt vào một dòng in i. Cần in ba số: 0, 1, 2."
  - "range() dừng trước giá trị kết thúc, nên để in ra ba số 0, 1, 2 thì giá trị kết thúc phải lớn hơn số cuối đúng một đơn vị."
group_hints:
  output_mismatch:
    - "range() dừng trước giá trị kết thúc."
    - "Đếm xem chương trình in ra mấy số so với đề: range(n) in ra đúng n số, bắt đầu từ 0."
    - "Cần in ba số, nên chọn mảnh range cho đúng ba số. Hãy thử từng mảnh range trong khay."
  wrong_order:
    - "Vòng lặp phải được viết đủ cả dòng for trước khi có thân vòng lặp."
    - "Dòng print(i) phải nằm bên dưới dòng for, không nằm trên."
    - "Hàng trên: for i in range(...) kết thúc bằng dấu hai chấm. Hàng dưới: print(i) thụt vào một mức."
  bad_indent:
    - "Dòng thân vòng lặp phải thụt vào một mức."
    - "Mảnh print(i) cần nằm ở cột thụt lề số 1, còn dòng for nằm sát cột 0."
    - "Đặt print(i) ở cột 1 của hàng ngay dưới dòng for."
  missing_colon:
    - "Dòng for phải kết thúc bằng dấu hai chấm."
    - "Mảnh ':' đặt cuối dòng for, sau mảnh range."
    - "Thêm mảnh ':' vào cuối hàng chứa for i in range(...)."
  missing_construct:
    - "Màn này yêu cầu dùng vòng lặp for."
    - "Chỉ dùng while hay in rời rạc chưa đủ; bài này luyện vòng lặp for với range()."
    - "Dùng mảnh for, i, in, một mảnh range và dấu hai chấm cho dòng đầu."
