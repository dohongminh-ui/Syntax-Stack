hints:
  - "Câu lệnh if cho chương trình rẽ nhánh: dòng thụt vào dưới if chỉ chạy khi điều kiện đúng."
  - "Tạo biến điểm, viết dòng if kiểm tra điểm, rồi in Đậu ở dòng thụt vào dưới if. Dòng if kết thúc bằng dấu hai chấm."
  - "Điều kiện cần là điểm lớn hơn hoặc bằng 5. Chọn toán tử so sánh đúng, và nhớ mảnh = chỉ dùng để gán giá trị."
group_hints:
  output_mismatch:
    - "Chương trình chạy nhưng in ra khác yêu cầu, hoặc không in gì."
    - "Điểm là 8 và cần in Đậu. Hãy kiểm tra điều kiện của if cho đúng và mảnh print bạn đã chọn."
    - "Với điểm 8, điều kiện diem so với 5 phải đúng; toán tử < làm điều kiện sai. Và mảnh print phải in Đậu."
  wrong_order:
    - "Biến phải được tạo trước khi dùng trong if."
    - "Dòng gán điểm phải nằm trên dòng if."
    - "Thứ tự từ trên xuống: gán điểm, dòng if, rồi dòng in thụt vào."
  bad_indent:
    - "Dòng nằm trong if phải thụt vào một mức; các dòng khác thì không."
    - "Chỉ mảnh print cần thụt vào, đặt ở cột thụt lề số 1. Dòng gán và dòng if sát cột 0."
    - "Đặt mảnh print ở cột 1 của hàng ngay dưới dòng if, không đặt ở cột 0."
  missing_colon:
    - "Dòng if phải kết thúc bằng dấu hai chấm."
    - "Mảnh ':' nằm cuối dòng if, sau số 5."
    - "Thêm mảnh ':' vào cuối hàng chứa if diem >= 5."
  missing_construct:
    - "Màn này yêu cầu dùng câu lệnh if (và một biến)."
    - "Đầu ra đúng chưa đủ: chương trình cần kiểm tra điều kiện bằng if."
    - "Dùng mảnh if, so sánh diem với 5, rồi đặt dòng print thụt vào dưới."
