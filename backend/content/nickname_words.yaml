# Used for ranked runs and races (always) and for classroom rooms in "random names" mode (default).
# Every animal x adjective combination must read as friendly. Left out on purpose:
#   Chó, Lợn, Heo, Bò, Khỉ (used as insults), Gà (slang for "noob"), Cá (cá vàng = poor memory),
#   and any adjective about bodies, age or intelligence in the negative.
# Names longer than 20 characters are never generated (the generator re-draws).

