range_includes_end: "range() không gồm giá trị kết thúc; nếu tưởng nó gồm thì kết quả bị thừa một lần lặp."
range_includes_end_en: "range() does not include its end value; if you think it does, the result has one round too many."
too_long: "Giá trị kết thúc quá lớn nên vòng lặp chạy thừa."
