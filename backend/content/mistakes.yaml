# Named common mistakes referenced by `name:` in content/templates/*.yaml.
# The note is shown after a wrong answer when the player's choice matches that mistake.
# Names without an entry simply get no extra note (the template explanation is still shown).
# English text: the same key with an `_en` suffix (`off_by_one_high_en`), shown when the request language is English.
off_by_one_high: "Lệch một đơn vị (thừa): chọn giá trị lớn hơn đáp án đúng một đơn vị."
off_by_one_high_en: "Off by one (too high): you picked a value one more than the right answer."
