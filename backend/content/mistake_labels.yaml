# Short Vietnamese labels for named mistakes, shown on the live-classroom dashboard
# ("Lỗi phổ biến nhất"). One line each, at most about 32 characters, readable from the back of a room.
# Keys are the distractor `name:` values in content/templates/*.yaml. A name missing here falls back to
# the first clause of its note in mistakes.yaml, then to "Lỗi khác". test_rooms checks every template
# name has a label.
# English labels: the same key with an `_en` suffix (`add_not_in_if_en`), at most 34 characters too.

